<!doctype html>
<html lang="id" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas per Bidang · Studio Ampenan</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="tugas.html">
<main>
  <div class="page-head">
    <h1>Tugas per Bidang</h1>
    <p class="muted">Ubah status, tanda terhambat, catatan, dan tautan hasil langsung di tabel, lalu tekan <b>Simpan ke spreadsheet</b>. Status: Belum mulai · Dikerjakan · Review pembimbing · Selesai.</p>
  </div>
  <div class="filters">
    <select id="f-bidang"></select>
    <select id="f-tahap"></select>
    <select id="f-status"></select>
    <input type="search" id="f-cari" placeholder="Cari tugas / nama">
    <span class="muted small" id="jumlah"></span>
  </div>
  <div class="table-wrap">
    <table class="tabel-isi">
      <thead><tr><th>ID</th><th>Tahap</th><th>Tugas</th><th>Bidang</th><th>PJ</th><th>Sesi</th><th>Tenggat</th><th>Status</th><th>Terhambat</th><th>Catatan</th><th>Tautan hasil</th></tr></thead>
      <tbody id="tabel"></tbody>
    </table>
  </div>
  <details class="card blok" style="margin-top:1rem">
    <summary><b>Tambah tugas baru</b></summary>
    <form id="form-tugas" class="form-isi grid grid-2" style="margin-top:.5rem">
      <label>Judul tugas<input name="judul" required></label>
      <label>Penanggung jawab<input name="pj" list="daftar-pj" required></label>
      <label>Bidang<input name="bidang" list="daftar-bidang" required></label>
      <label>Aspek<input name="aspek" list="daftar-aspek"></label>
      <label>Tahap<select name="tahap"><option value="0">0 · Persiapan &amp; survei</option><option value="1">1 · Analisis 6 aspek</option><option value="2">2 · AHP-WLC</option><option value="3">3 · Konflik &amp; mismatch</option><option value="4">4 · SWOT &amp; laporan</option></select></label>
      <label>Sesi target<input name="sesi_target" inputmode="numeric"></label>
      <label>Tenggat<input name="tenggat" type="date"></label>
      <label>Catatan<input name="catatan"></label>
      <div><button class="btn-kecil">Masukkan ke daftar simpan</button> <span class="small muted" id="baru-info"></span></div>
    </form>
    <datalist id="daftar-pj"></datalist><datalist id="daftar-bidang"></datalist><datalist id="daftar-aspek"></datalist>
  </details>
  <div id="bar"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function () {
  const { bacaTab, esc, opsi, benar, tanggal, formatTanggal, config } = Studio;
  const NAMA_TAHAP = { "0": "Persiapan & survei", "1": "1 · Analisis 6 aspek", "2": "2 · AHP-WLC", "3": "3 · Konflik & mismatch", "4": "4 · SWOT & laporan" };
  const STATUS = ["Belum mulai", "Dikerjakan", "Review pembimbing", "Selesai"];
  const tugas = await bacaTab("tugas");
  const cfg = await config();
  const tahapNama = (t) => NAMA_TAHAP[t.tahap] || t.tahap;
  const fB = document.getElementById("f-bidang"), fT = document.getElementById("f-tahap");
  const fS = document.getElementById("f-status"), fQ = document.getElementById("f-cari");
  opsi(fB, tugas.map((t) => t.bidang), "Semua bidang");
  opsi(fT, tugas.map(tahapNama), "Semua tahap");
  opsi(fS, STATUS, "Semua status");
  const daftar = (id, v) => { document.getElementById(id).innerHTML = [...new Set(v.filter(Boolean))].map((x) => `<option value="${esc(x)}">`).join(""); };
  daftar("daftar-pj", [...(cfg.anggota_tim || []), ...tugas.map((t) => t.pj)]);
  daftar("daftar-bidang", tugas.map((t) => t.bidang));
  daftar("daftar-aspek", tugas.map((t) => t.aspek));

  const baru = [];
  const segarkan = Studio.barSimpan(document.getElementById("bar"), { tab: "tugas", baris: tugas, tambahan: () => baru });
  const hariIni = new Date(new Date().toDateString());
  const ubah = (t, k) => (t._asli && String(t[k] ?? "") !== String(t._asli[k] ?? "") ? " ubah" : "");

  function render() {
    const q = fQ.value.toLowerCase();
    const rows = tugas.map((t, i) => [t, i]).filter(([t]) => (!fB.value || t.bidang === fB.value) && (!fT.value || tahapNama(t) === fT.value) &&
      (!fS.value || t.status === fS.value) && (!q || [t.judul, t.pj, t.catatan].join(" ").toLowerCase().includes(q)));
    document.getElementById("jumlah").textContent = `${rows.length} dari ${tugas.length} tugas`;
    document.getElementById("tabel").innerHTML = rows.map(([t, i]) => {
      const d = tanggal(t.tenggat);
      const telat = d && d < hariIni && !/selesai/i.test(t.status);
      const judul = t.tautan_hasil ? `<a href="${esc(t.tautan_hasil)}" target="_blank" rel="noopener">${esc(t.judul)}</a>` : esc(t.judul);
      const pilihan = [...new Set([...STATUS, t.status].filter(Boolean))];
      return `<tr><td>${esc(t.id)}</td><td class="small">${esc(tahapNama(t))}</td><td>${judul}</td><td>${esc(t.bidang)}</td>
        <td>${esc(t.pj)}</td><td class="num">${esc(t.sesi_target)}</td>
        <td${telat ? ' style="color:var(--bad);font-weight:600"' : ""}>${formatTanggal(d)}</td>
        <td><select data-i="${i}" data-k="status" class="${ubah(t, "status")}">${pilihan.map((v) => `<option${v === t.status ? " selected" : ""}>${esc(v)}</option>`).join("")}</select></td>
        <td style="text-align:center"><input type="checkbox" data-i="${i}" data-k="terhambat" style="width:auto;min-width:0" ${benar(t.terhambat) ? "checked" : ""}></td>
        <td><input data-i="${i}" data-k="catatan" value="${esc(t.catatan)}" class="${ubah(t, "catatan")}"></td>
        <td><input data-i="${i}" data-k="tautan_hasil" value="${esc(t.tautan_hasil)}" placeholder="https://" class="${ubah(t, "tautan_hasil")}"></td></tr>`;
    }).join("");
  }
  document.getElementById("tabel").addEventListener("input", (e) => {
    const el = e.target, t = tugas[+el.dataset.i];
    if (!t) return;
    const k = el.dataset.k;
    // Kotak centang: pertahankan bentuk asli (TRUE/FALSE) bila tidak berubah.
    t[k] = el.type === "checkbox" ? (el.checked === benar(t._asli[k]) ? t._asli[k] : el.checked ? "TRUE" : "FALSE") : el.value;
    el.classList.toggle("ubah", String(t[k] ?? "") !== String(t._asli[k] ?? ""));
    segarkan();
  });
  document.getElementById("form-tugas").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    baru.push({ ...Object.fromEntries(new FormData(f)), status: "Belum mulai" });
    document.getElementById("baru-info").textContent = `${baru.length} tugas baru menunggu disimpan (ID dibuat otomatis).`;
    f.reset();
    segarkan();
  });
  [fB, fT, fS].forEach((el) => el.addEventListener("change", render));
  fQ.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
